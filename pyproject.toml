[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcplock"
version = "0.1.0"
description = "Pin, diff, and lint MCP tool definitions — npm audit / SRI for MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
lint = ["scikit-learn>=1.4.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
mcplock = "mcplock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcplock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
