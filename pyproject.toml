[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcplock"
version = "1.0.3"
description = "Pin, diff, and lint MCP tool definitions — npm audit / SRI for MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yashrajsinh Rathod" }]
keywords = ["mcp", "model-context-protocol", "security", "supply-chain", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

# Phase 4 only: record/replay a real LLM-backed agent against a server and
# evaluate what it actually did. Declared now so config is not restructured later.
#
# The PyPI distribution is "openeval-core", NOT "openeval" — the bare name is an
# unrelated abandoned pypa sampleproject stub (0.0.3, "A small example package").
# Do not "fix" this to `openeval`.
#
# The floor matters as much as the name: openeval-core 0.1.2 resolves cleanly but
# does not contain openeval/adapters/fixtura.py, which landed after it shipped
# (0.2.0 was never published). Pinning >=0.1.2 installs fine and then fails at
# import, which `pip install --dry-run` cannot catch — it resolves, it never
# imports. Verify this extra with a real import in a clean venv.
#
# fixtura 2.0.0+ moves every package under the `fixtura.` namespace. Both Phase 4
# scripts (`scripts/phase4_experiment.py` and `scripts/phase4_p2_and_pipeline.py`)
# have been updated to `from fixtura.recorder.recorder import ExecutionRecorder`,
# so mcplock pins fixtura>=2.0.0 at minimum.
#
# The floor is 2.0.1, not 2.0.0, and that is a correctness requirement rather
# than housekeeping. On 2.0.0, ExecutionRecorder.record_event mutated the event
# dict passed to it, overwriting step_id in place (int -> str). Both Phase 4
# scripts record each event and then keep it to write the plain-text
# .events.jsonl beside the trace — which exists so a run can be audited without
# decompressing zstd frames. Under 2.0.0 that log reports fixtura's step_ids
# instead of the ones the harness emitted, so the audit log silently stops being
# an independent record. Fixed in 2.0.1 (fixtura-core#16).
validate = [
    "fixtura>=2.0.1",
    "openeval-core>=0.2.1",
]

[project.urls]
Homepage = "https://github.com/yash161004/mcplock"
Source = "https://github.com/yash161004/mcplock"
Issues = "https://github.com/yash161004/mcplock/issues"

[project.scripts]
mcplock = "mcplock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcplock"]

# The sdist ships to PyPI alongside the wheel and is world-readable forever —
# yanking a release does not delete its files. Hatchling's default is to sweep
# the working tree, which pulled in `docs/INTERNAL_FINDINGS.md` (undisclosed
# third-party findings), `docs/disclosure_drafts/` (unsent private reports),
# `AGENT_BRIEF.md`, and a stale `.agent/worktrees/` copy. Publishing any of those
# would breach docs/DISCLOSURE.md irreversibly.
#
# This list is an allowlist on purpose. Adding a path here publishes it. Do not
# replace it with an `exclude` list — a new sensitive file would then ship by
# default, which is the failure mode this exists to prevent.
[tool.hatch.build.targets.sdist]
only-include = [
    "mcplock",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: spawns a real MCP server subprocess and drives the CLI end to end",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["mcplock", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = []

