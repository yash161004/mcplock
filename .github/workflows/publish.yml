name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcplock
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored in
      # this repository, and none needs to be.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the version in pyproject.toml
        # Publishing is irreversible: PyPI does not allow re-uploading a version.
        # Catch a tag/metadata mismatch before the upload rather than after.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG does not match pyproject.toml version $VERSION."
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Install build
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Check the sdist does not carry undisclosed findings
        # docs/INTERNAL_FINDINGS.md and the disclosure drafts must never ship.
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          blocked = ("INTERNAL_FINDINGS", "disclosure_drafts")
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as tar:
                  for name in tar.getnames():
                      if any(b in name for b in blocked):
                          sys.exit(f"ERROR: {path} contains {name}")
          print("sdist is clean")
          PY

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
