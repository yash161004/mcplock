name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcplock
    permissions:
      # Required for PyPI Trusted Publishing (OIDC), which is still the preferred
      # path — see the "Publish package" step for how the token fallback works.
      # Trusted Publisher must be registered on pypi.org (NOT test.pypi.org — that
      # mismatch yields `invalid-publisher` indefinitely, which is how the earlier
      # attempts failed):
      #   - Owner: yash161004
      #   - Repository name: mcplock
      #   - Workflow name: publish.yml
      #   - Environment name: pypi
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the version in pyproject.toml
        # Publishing is irreversible: PyPI does not allow re-uploading a version.
        # Catch a tag/metadata mismatch before the upload rather than after.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG does not match pyproject.toml version $VERSION."
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Install build
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Check the sdist does not carry undisclosed findings
        # docs/INTERNAL_FINDINGS.md and the disclosure drafts must never ship.
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          blocked = ("INTERNAL_FINDINGS", "disclosure_drafts")
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as tar:
                  for name in tar.getnames():
                      if any(b in name for b in blocked):
                          sys.exit(f"ERROR: {path} contains {name}")
          print("sdist is clean")
          PY

      - name: Report which credential path will be used
        # Earlier releases failed at the upload step with `invalid-publisher` and
        # were retried blind, because the log never said which path was taken.
        # This prints that up front. It reports presence only — never the value.
        env:
          USE_PYPI_TOKEN: ${{ vars.USE_PYPI_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "$USE_PYPI_TOKEN" = "true" ]; then
            if [ -n "$PYPI_API_TOKEN" ]; then
              echo "::warning::Publishing with an API token. PEP 740 attestations"
              echo "::warning::are DISABLED on this release — the action ignores"
              echo "::warning::them whenever an explicit password is set."
              echo "vars.USE_PYPI_TOKEN=true and the secret is present"
              echo "  -> uploading with an API token, WITHOUT attestations."
            else
              echo "vars.USE_PYPI_TOKEN=true but PYPI_API_TOKEN is empty or unset"
              echo "  -> falling through to Trusted Publishing (OIDC)."
            fi
          else
            echo "-> attempting Trusted Publishing (OIDC), with attestations."
            echo "If this fails with 'invalid-publisher', the publisher on"
            echo "pypi.org does not match the claims below. The field most often"
            echo "missed is the environment name, which must be 'pypi':"
            echo "  owner=${GITHUB_REPOSITORY_OWNER} repo=${GITHUB_REPOSITORY}"
            echo "  workflow=publish.yml environment=pypi"
            echo "Break glass: set repository variable USE_PYPI_TOKEN=true."
          fi

      - name: Publish package
        # Trusted Publishing (OIDC) is the default path, and the only one that
        # produces PEP 740 attestations. gh-action-pypi-publish chooses with:
        #
        #   [[ "${INPUT_USER}" == "__token__" && -z "${INPUT_PASSWORD}" ]] \
        #       && TRUSTED_PUBLISHING=true || TRUSTED_PUBLISHING=false
        #
        # so an empty `password` means OIDC.
        #
        # The token is gated behind an explicit repository *variable*, not merely
        # the presence of the secret. 1.0.2 shipped without provenance because
        # the secret alone was enough to divert to the token path, and the action
        # only whispers about it in a warning:
        #
        #   "The workflow was run with the 'attestations: true' input, but an
        #    explicit password was also set, disabling Trusted Publishing."
        #
        # For a supply-chain tool, losing provenance silently is the wrong
        # default. Now it takes a deliberate `USE_PYPI_TOKEN=true` to give it up,
        # and the step above says so loudly when that happens.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ vars.USE_PYPI_TOKEN == 'true' && secrets.PYPI_API_TOKEN || '' }}
          attestations: true
